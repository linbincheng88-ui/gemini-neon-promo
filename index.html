<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemini 4 Neon · 1080×1080 手绘动效宣传短片</title>
<style>
  @font-face {
    font-family: 'Wenkai';
    src: url('./fonts/LXGWWenKai-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'Wenkai';
    src: url('./fonts/LXGWWenKai-Medium.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #1b1a17;
    overflow: hidden;
    font-family: 'Wenkai', 'PingFang SC', cursive, sans-serif;
  }
  body.render-mode {
    width: 1080px;
    height: 1080px;
    background: #f6f3e9;
  }
  .shell {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  body.render-mode .shell {
    width: 1080px;
    height: 1080px;
    padding: 0;
    gap: 0;
  }
  #stage-wrap {
    width: min(calc(100vh - 88px), calc(100vw - 32px), 1080px);
    height: min(calc(100vh - 88px), calc(100vw - 32px), 1080px);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    background: #f6f3e9;
  }
  body.render-mode #stage-wrap {
    width: 1080px;
    height: 1080px;
    border-radius: 0;
    box-shadow: none;
  }
  #stage {
    width: 100%;
    height: 100%;
    display: block;
    font-family: 'Wenkai', 'PingFang SC', cursive, sans-serif;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(250, 247, 239, 0.94);
    border: 2px solid #302d27;
    border-radius: 999px;
    padding: 8px 18px;
    color: #302d27;
    font-size: 14px;
  }
  body.render-mode .controls { display: none; }
  .controls button {
    border: 1.5px solid #302d27;
    background: #f2cf65;
    color: #302d27;
    border-radius: 999px;
    padding: 4px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .controls input[type="range"] { width: 280px; accent-color: #4f94f0; }
</style>
</head>
<body>
<div class="shell">
  <div id="stage-wrap">
    <svg id="stage" width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="controls">
    <button id="btn-play">暂停</button>
    <button id="btn-replay">重播</button>
    <input id="scrubber" type="range" min="0" max="419" value="0" />
    <span id="time-label">00.00s / 14.00s</span>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const RENDER_MODE = params.get('render') === '1';
  if (RENDER_MODE) document.body.classList.add('render-mode');

  const FPS = 30;
  const TOTAL_FRAMES = 420; // 14.0s (< 15s)
  const SVG_NS = 'http://www.w3.org/2000/svg';

  // Palette: faithful to reference cream paper + charcoal ink + Gemini Neon luminous accents
  const INK = '#302d27';
  const PAPER = '#f6f3e9';
  const TEAL = '#6bc6c2';
  const CYAN = '#46d1e6';
  const NEON_BLUE = '#5894f5';
  const NEON_VIOLET = '#9e84ee';
  const GOLD = '#f2cf65';
  const CORAL = '#d8735e';
  const MINT = '#7ed1b6';

  const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const easeInOutCubic = (x) => {
    const t = clamp(x);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  };
  const easeOutBack = (x) => {
    const t = clamp(x);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  const progress = (t, a, b, ease = easeInOutCubic) => ease(clamp((t - a) / (b - a)));
  const seed = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
  };
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Hand-drawn SVG primitives matching reference craft
  const Label = ({ x, y, text, size = 18, fill = INK, anchor = 'start', weight = 400, extra = '' }) =>
    `<text x="${x}" y="${y}" fill="${fill}" font-family="Wenkai, 'PingFang SC', cursive" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" ${extra}>${esc(text)}</text>`;

  const Box = ({ x, y, w, h, r = 9, fill = PAPER, stroke = INK, sw = 2.3, opacity = 1 }) => `
    <g opacity="${opacity}">
      <rect x="${(x + 1.8).toFixed(1)}" y="${(y + 1.6).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${r}" fill="${stroke}" opacity="0.09"/>
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
      <path d="M ${(x + r + 3).toFixed(1)} ${(y + 1.5).toFixed(1)} Q ${(x + w * 0.52).toFixed(1)} ${(y - 1.1).toFixed(1)} ${(x + w - r).toFixed(1)} ${(y + 1.1).toFixed(1)} M ${(x + 1.1).toFixed(1)} ${(y + r).toFixed(1)} Q ${(x - 1.0).toFixed(1)} ${(y + h * 0.58).toFixed(1)} ${(x + 1.8).toFixed(1)} ${(y + h - r).toFixed(1)}" fill="none" stroke="${stroke}" stroke-width="0.6" opacity="0.36"/>
    </g>`;

  const Star = (x, y, r = 8, fill = '#fff7d2', opacity = 1, stroke = INK) => `
    <path d="M${x} ${y - r} Q${x + r * 0.16} ${y - r * 0.16} ${x + r} ${y} Q${x + r * 0.16} ${y + r * 0.16} ${x} ${y + r} Q${x - r * 0.16} ${y + r * 0.16} ${x - r} ${y} Q${x - r * 0.16} ${y - r * 0.16} ${x} ${y - r}Z" fill="${fill}" stroke="${stroke}" stroke-width="${Math.max(1, r * 0.14).toFixed(2)}" opacity="${opacity}"/>`;

  const Heart = (x, y, s = 1, fill = '#ee8ea8') => `
    <path transform="translate(${x} ${y}) scale(${s})" d="M0 5 C-17 -7 -13 -20 -5 -19 C-1 -19 0 -13 0 -13 C1 -22 16 -23 13 -9 C11 -2 5 3 0 8Z" fill="${fill}" stroke="${INK}" stroke-width="2.2"/>`;

  const Sticker = ({ x, y, text, size = 32, fill = GOLD, rotate = 0 }) => `
    <g transform="rotate(${rotate} ${x} ${y})">
      ${Label({ x: x + 1.5, y: y + 3.5, text, size, anchor: 'middle', fill: INK, weight: 700, extra: `stroke="${INK}" stroke-width="8" stroke-linejoin="round"` })}
      ${Label({ x, y, text, size, anchor: 'middle', fill, weight: 700, extra: `stroke="${INK}" stroke-width="4.4" paint-order="stroke" stroke-linejoin="round"` })}
    </g>`;

  // Stretchy rubber-hose arm matching reference signature
  const Arm = (x1, y1, x2, y2, bend = 0) => {
    const mx = (x1 + x2) / 2 + bend;
    const my = (y1 + y2) / 2 - Math.abs(x2 - x1) * 0.08;
    return `
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${INK}" stroke-width="13"/>
        <path d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${NEON_BLUE}" stroke-width="8.2"/>
        <circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="7.5" fill="${CYAN}" stroke="${INK}" stroke-width="2.2"/>
      </g>`;
  };

  // Adorable original hand-drawn Gemini Neon Mascot ("小霓 · Neon Bot")
  const NeonBot = ({ x = 0, y = 0, s = 1, t = 0, mood = 'happy', dance = false, glasses = false, rotate = 0 }) => {
    const beat = t * (128 / 60) * Math.PI * 2;
    const sway = dance ? Math.sin(beat * 0.5) * 7.5 : Math.sin(t * 3.5) * 1.2;
    const hop = dance ? -Math.abs(Math.sin(beat * 0.5)) * 10 : 0;

    let eyes = '';
    if (mood === 'focus') {
      eyes = `<path d="M27 25 l12 3.5 M61 28.5 l12 -3.5" stroke="${INK}" stroke-width="4.2" stroke-linecap="round"/>`;
    } else if (mood === 'sleep') {
      eyes = `<path d="M27 29 h11 M62 29 h11" stroke="${INK}" stroke-width="3.8" stroke-linecap="round"/>`;
    } else if (mood === 'happy') {
      eyes = `<path d="M27 31 Q33 17 40 31 M60 31 Q66 17 73 31" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
    } else {
      // wink
      eyes = `<ellipse cx="33" cy="28" rx="3.5" ry="7.5" fill="${INK}"/><circle cx="34" cy="25" r="1.4" fill="#fff" stroke="none"/><path d="M60 30 Q66 18 73 30" fill="none" stroke="${INK}" stroke-width="3.4" stroke-linecap="round"/>`;
    }

    const cheeks = (mood === 'happy' || mood === 'wink')
      ? `<ellipse cx="22" cy="40" rx="8.5" ry="4.2" fill="#f195b2" stroke="none" opacity="0.72"/><ellipse cx="78" cy="40" rx="8.5" ry="4.2" fill="#f195b2" stroke="none" opacity="0.72"/>`
      : '';

    const hatches = Array.from({ length: 12 }, (_, i) =>
      `<path d="M${9 + i * 7} 13 l-4 11" opacity="0.16" stroke="#c8f4ff" stroke-width="1.2"/>`).join('');

    const glassesSvg = glasses ? `
      <g transform="translate(19 -6) rotate(-4)">
        <path d="M0 0 H66 L60 14 H43 L33 5 L24 14 H8Z" fill="${INK}" stroke="${INK}" stroke-width="1.5"/>
        <path d="M12 3 l-5 7 m10 -7 l-5 7 m34 -7 l-5 7 m10 -7 l-5 7" stroke="#9df3ff" stroke-width="1.8" stroke-linecap="round"/>
      </g>` : '';

    return `
      <g transform="translate(${x.toFixed(1)} ${(y + hop).toFixed(1)}) scale(${s}) rotate(${(rotate + sway).toFixed(2)} 50 35)" stroke="${INK}" stroke-width="2.3" stroke-linejoin="round">
        ${dance ? Arm(4, 34, -16, -6 + Math.sin(beat) * 7, -14) + Arm(96, 34, 116, -10 - Math.sin(beat) * 7, 14) : ''}
        <!-- 4 stubby legs matching reference charm -->
        <path d="M13 60 L14 85 L23 86 L24 61 M29 61 L30 86 L39 85 L39 61 M63 61 L64 85 L73 86 L74 61 M78 60 L79 84 L88 84 L89 59" fill="url(#neon-bot-leg)"/>
        ${!dance ? `<path d="M0 28 H-10 V40 H0 M100 28 H110 V40 H100" fill="${NEON_BLUE}"/>` : ''}
        <!-- Cute rounded-prism hand-drawn neon body -->
        <path d="M2 8 Q50 -4 98 8 L101 58 Q50 67 -1 58Z" fill="url(#neon-bot-body)"/>
        <!-- Top rim highlight -->
        <path d="M8 10 Q50 2 92 10" fill="none" stroke="#baf7ff" stroke-width="2.8" opacity="0.85" stroke-linecap="round"/>
        ${hatches}
        <!-- Gemini 4-point star emblem on forehead -->
        ${Star(50, 12, 8.5, '#fff8c9', 0.96, INK)}
        ${eyes}
        ${cheeks}
        <!-- Cute little smile -->
        ${mood === 'happy' || mood === 'wink' ? `<path d="M44 41 Q50 47 56 41" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>` : ''}
        ${glassesSvg}
      </g>`;
  };

  // =====================================================================
  // 4 Original Hand-Drawn Animated Vector Artworks for Gemini 4 Neon
  // ViewBox: 0 0 200 300 (matches center device & thumbnails cleanly!)
  // =====================================================================
  const ArtCode = (t, small) => {
    const scanY = 58 + ((t * 48) % 168);
    const lines = [
      { y: 58, w: 68, c: '#79c0ff', indent: 0 },
      { y: 74, w: 112, c: '#c8b6ff', indent: 12 },
      { y: 90, w: 94, c: '#f2cf65', indent: 12 },
      { y: 108, w: 126, c: '#e57c73', indent: 22, strike: true },
      { y: 126, w: 132, c: '#66e3b8', indent: 22, plus: true },
      { y: 144, w: 118, c: '#66e3b8', indent: 22, plus: true },
      { y: 162, w: 84, c: '#79c0ff', indent: 12 },
      { y: 178, w: 104, c: '#56e0f0', indent: 12 },
      { y: 196, w: 60, c: '#c8b6ff', indent: 0 },
    ];
    return `
      <rect width="200" height="300" fill="url(#art-code-bg)"/>
      <!-- Subtle blueprint grid -->
      ${!small ? Array.from({ length: 10 }, (_, i) => `<path d="M0 ${i * 32} H200 M${i * 22} 0 V300" stroke="#4f6799" stroke-width="0.6" opacity="0.18"/>`).join('') : ''}
      <!-- Hand-drawn IDE Window inside phone -->
      <rect x="14" y="28" width="172" height="196" rx="12" fill="#1e2238" stroke="${INK}" stroke-width="2.5"/>
      <rect x="14" y="28" width="172" height="22" rx="10" fill="#2d3354" stroke="${INK}" stroke-width="2"/>
      <circle cx="26" cy="39" r="3" fill="#e57c73"/><circle cx="36" cy="39" r="3" fill="${GOLD}"/><circle cx="46" cy="39" r="3" fill="${MINT}"/>
      ${!small ? Label({ x: 108, y: 42, text: 'agent_refactor.ts', size: 8.5, fill: '#b9c6e6', anchor: 'middle' }) : ''}
      ${lines.map((ln, i) => {
        const pulse = ln.plus ? 0.78 + 0.22 * Math.sin(t * 7 + i) : 0.92;
        return `
          ${ln.plus ? `<rect x="20" y="${ln.y - 8}" width="160" height="14" rx="3" fill="#32b88c" opacity="0.22"/>` : ''}
          ${ln.strike ? `<rect x="20" y="${ln.y - 8}" width="160" height="14" rx="3" fill="#e06666" opacity="0.20"/>` : ''}
          <rect x="${26 + ln.indent}" y="${ln.y - 4}" width="${ln.w}" height="6.5" rx="3.2" fill="${ln.c}" opacity="${pulse.toFixed(2)}"/>
          ${ln.plus && !small ? `<text x="23" y="${ln.y + 2}" font-size="9" fill="#6ff2c5" font-weight="700">+</text>` : ''}
          ${ln.strike && !small ? `<text x="23" y="${ln.y + 2}" font-size="9" fill="#f08982" font-weight="700">-</text>` : ''}
        `;
      }).join('')}
      <!-- Glowing neon scan line -->
      ${!small ? `<rect x="18" y="${scanY.toFixed(1)}" width="164" height="3" fill="${CYAN}" opacity="0.65"/>` : ''}
      <!-- Floating Pass Badge -->
      <g transform="translate(18 ${238 + Math.sin(t * 5) * 3})">
        <rect x="0" y="0" width="164" height="38" rx="10" fill="#e9fbf3" stroke="${INK}" stroke-width="2.2"/>
        <circle cx="22" cy="19" r="10" fill="${MINT}" stroke="${INK}" stroke-width="1.8"/>
        <path d="M17 19 l4 4 7 -8" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        ${Label({ x: 40, y: 17, text: '42 Tests Passed', size: 12.5, fill: INK, weight: 700 })}
        ${Label({ x: 40, y: 31, text: '一次重构 · 零报错', size: 10.5, fill: '#4e7769' })}
      </g>
      ${!small ? Star(174, 62, 6, GOLD) + Star(24, 212, 5, CYAN) : ''}
    `;
  };

  const ArtReason = (t, small) => {
    const nodes = [
      [44, 72], [156, 76], [34, 152], [166, 148], [52, 224], [148, 220], [100, 52], [100, 248]
    ];
    const pulse = 1 + 0.08 * Math.sin(t * 6);
    return `
      <rect width="200" height="300" fill="url(#art-reason-bg)"/>
      <!-- Twinkling stars -->
      ${Array.from({ length: small ? 12 : 28 }, (_, i) =>
        `<circle cx="${(seed(i + 11) * 196).toFixed(1)}" cy="${(seed(i + 41) * 290).toFixed(1)}" r="${i % 4 === 0 ? 1.6 : 0.8}" fill="#e8f9ff" opacity="${(0.45 + 0.45 * Math.sin(t * 3 + i)).toFixed(2)}"/>`).join('')}
      <!-- Radial prism aura -->
      <circle cx="100" cy="148" r="${(58 * pulse).toFixed(1)}" fill="${CYAN}" opacity="0.14"/>
      <circle cx="100" cy="148" r="${(38 * pulse).toFixed(1)}" fill="${NEON_VIOLET}" opacity="0.22"/>
      <!-- Constellation links -->
      ${nodes.map(([nx, ny], i) => `
        <line x1="100" y1="148" x2="${nx}" y2="${ny}" stroke="${i % 2 ? CYAN : '#d2baff'}" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.65"/>
        <circle cx="${nx}" cy="${ny}" r="${(6 + Math.sin(t * 4 + i) * 1.5).toFixed(1)}" fill="${i % 3 === 0 ? GOLD : i % 3 === 1 ? CYAN : '#d7b8ff'}" stroke="${INK}" stroke-width="1.7"/>
      `).join('')}
      <!-- Central Radiant Gemini 4-Point Prism -->
      <g transform="translate(100 148) rotate(${(Math.sin(t * 2.2) * 8).toFixed(1)}) scale(${pulse.toFixed(3)})">
        <path d="M0 -42 Q9 -9 42 0 Q9 9 0 42 Q-9 9 -42 0 Q-9 -9 0 -42Z" fill="url(#gemini-star-grad)" stroke="${INK}" stroke-width="2.6"/>
        <path d="M0 -22 Q5 -5 22 0 Q5 5 0 22 Q-5 5 -22 0 Q-5 -5 0 -22Z" fill="#fffdf5" opacity="0.88"/>
      </g>
      ${!small ? `
        <g transform="translate(26 258)">
          <rect width="148" height="28" rx="14" fill="#fffdf4" stroke="${INK}" stroke-width="2"/>
          ${Label({ x: 74, y: 19, text: 'XHigh 深度推理', size: 13, fill: INK, anchor: 'middle', weight: 700 })}
        </g>` : ''}
    `;
  };

  const ArtContext = (t, small) => {
    const beamY = 74 + Math.sin(t * 3.4) * 56 + 56;
    const docs = [
      { x: 34, y: 76, rot: -6, c: '#fffdf4', tag: 'API' },
      { x: 56, y: 98, rot: 4, c: '#e5f9fb', tag: 'PDF' },
      { x: 42, y: 126, rot: -3, c: '#f2ebff', tag: 'REPO' },
      { x: 52, y: 158, rot: 2, c: '#fff8db', tag: '1M' },
    ];
    return `
      <rect width="200" height="300" fill="url(#art-ctx-bg)"/>
      ${!small ? Array.from({ length: 24 }, (_, i) =>
        `<circle cx="${(seed(i + 71) * 195).toFixed(1)}" cy="${(seed(i + 91) * 290).toFixed(1)}" r="2.2" fill="#fff" opacity="0.45"/>`).join('') : ''}
      <!-- Header pill -->
      <rect x="34" y="24" width="132" height="32" rx="16" fill="#302d27"/>
      ${Label({ x: 100, y: 45, text: '1,000,000 Tokens', size: 13, fill: CYAN, anchor: 'middle', weight: 700 })}
      <!-- Stacked hand-drawn document sheets -->
      ${docs.map((d, i) => `
        <g transform="translate(${d.x} ${(d.y + Math.sin(t * 3 + i) * 3).toFixed(1)}) rotate(${d.rot} 55 30)">
          <rect x="0" y="0" width="112" height="62" rx="8" fill="${d.c}" stroke="${INK}" stroke-width="2.2"/>
          <path d="M12 18 H72 M12 30 H96 M12 42 H82" stroke="${INK}" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
          <rect x="74" y="8" width="30" height="15" rx="5" fill="${i === 3 ? GOLD : CYAN}" stroke="${INK}" stroke-width="1.3"/>
          ${Label({ x: 89, y: 19, text: d.tag, size: 9.5, fill: INK, anchor: 'middle', weight: 700 })}
        </g>`).join('')}
      <!-- Electric cyan scan laser -->
      <rect x="16" y="${beamY.toFixed(1)}" width="168" height="5" rx="2.5" fill="${CYAN}" opacity="0.9"/>
      <rect x="16" y="${(beamY - 8).toFixed(1)}" width="168" height="21" fill="${CYAN}" opacity="0.18"/>
      ${!small ? Heart(168, 86 + Math.sin(t * 4) * 5, 0.58, '#ee8ea8') + Star(28, 224, 7, GOLD) : ''}
    `;
  };

  const ArtNeonStage = (t, small, punch = 0, flash = 0) => {
    const beat = t * (128 / 60) * Math.PI * 2;
    const scaleBounce = 1 + punch * (0.14 + 0.08 * Math.abs(Math.sin(beat * 0.5)));
    const tiles = [];
    for (let row = 0; row < 6; row++) {
      const y1 = 206 + Math.pow(row / 6, 1.65) * 94;
      const y2 = 206 + Math.pow((row + 1) / 6, 1.65) * 94;
      const w1 = 36 + (y1 - 206) * 2.1;
      const w2 = 36 + (y2 - 206) * 2.1;
      for (let col = 0; col < 8; col++) {
        const colors = ['#48c9e0', '#608ef5', '#9c7ef0', '#3d4c8c', '#57b8c6', '#f2cf65', '#c880cf'];
        const c = colors[(row * 3 + col + Math.floor(t * 4)) % colors.length];
        tiles.push(`<path d="M${(100 - w1 / 2 + col * w1 / 8).toFixed(1)} ${y1.toFixed(1)} L${(100 - w1 / 2 + (col + 1) * w1 / 8).toFixed(1)} ${y1.toFixed(1)} L${(100 - w2 / 2 + (col + 1) * w2 / 8).toFixed(1)} ${y2.toFixed(1)} L${(100 - w2 / 2 + col * w2 / 8).toFixed(1)} ${y2.toFixed(1)}Z" fill="${c}" opacity="0.88" stroke="#222749" stroke-width="0.6"/>`);
      }
    }
    return `
      <rect width="200" height="300" fill="url(#art-neon-bg)"/>
      <!-- Sweeping neon spotlights -->
      <g opacity="${(0.18 + flash * 0.16).toFixed(2)}">
        ${[0, 1, 2].map(i => `<path transform="rotate(${(Math.sin(t * 2.5 + i * 1.4) * 24).toFixed(1)} 100 44)" d="M100 44 L${-75 + i * 115} 214 L${-25 + i * 115} 214Z" fill="${i === 1 ? '#ffe899' : i === 0 ? '#79f2ff' : '#d2b0ff'}"/>`).join('')}
      </g>
      <!-- Neon perspective floor -->
      <path d="M0 206 H200 V300 H0Z" fill="#1e2447"/>
      ${tiles.join('')}
      <!-- Hanging Faceted Gemini Neon Prism -->
      <path d="M100 0 V24" stroke="${INK}" stroke-width="2.2"/>
      <g transform="translate(100 46) rotate(${(Math.sin(t * 3) * 10).toFixed(1)})">
        <circle cx="0" cy="0" r="24" fill="${CYAN}" opacity="${(0.18 + flash * 0.15).toFixed(2)}"/>

  };

  const renderArt = (kind, t, small = false, punch = 0, flash = 0) => {
    if (kind === 'code') return ArtCode(t, small);
    if (kind === 'reason') return ArtReason(t, small);
    if (kind === 'context') return ArtContext(t, small);
    return ArtNeonStage(t, small, punch, flash);
  };

  const ArtTile = (x, y, w, h, kind, clipId) => `
    <g>
      <defs><clipPath id="${clipId}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/></clipPath></defs>

  // Hand-drawn transition icons (exact charm of reference)
  const TransitionIcon = (idx, x, y, s = 1) => {
    let body = '';
    if (idx === 0) {
      // Spiral spin
      body = `

        <path d="M9 -16 C-10 -24 -24 1 -10 14 C5 29 26 7 14 -6 C3 -19 -11 -3 -1 6 C8 15 14 0 6 -3" fill="none"/>

    } else if (idx === 2) {

      body = `

        <path d="M-7 -11 H9 M-7 -4 H9 M-7 3 H6 M-7 10 H1"/>

      // Zoom punch
      body = `<circle cx="-3" cy="-4" r="13" fill="#e2f7fa"/><path d="M6 7 l16 16" stroke="${CORAL}" stroke-width="8.5"/><path d="M-3 -10 v12 m-6 -6 h12"/>`;

      body = `<rect x="-12" y="-14" width="27" height="29" rx="3" fill="${TEAL}"/><path d="M-1 -7 l8 8 -8 7" fill="none" stroke="#fff" stroke-width="4"/><path d="M-25 -9 h8 m-10 8 h10 m-8 8 h7"/>`;

  // =====================================================================
  // Timeline State Machine (14.0 seconds = 420 frames @ 30fps)
  // =====================================================================
  function stateAt(frame) {
    const t = frame / FPS;
    // Cut progress (snipping out slow bloat at 4.72..5.22s)
    const cut = progress(t, 4.72, 5.22, easeInOutCubic);

    // Sidebar active tab: 0=素材, 1=特效, 2=字幕
    const tab = t < 5.55 ? 0 : t < 6.72 ? 1 : 2;

    // Right panel sliders (animated 7.55..9.25s)
    const thinkVal = lerp(0.42, 0.96, progress(t, 7.55, 8.00));
    const codeAcc = lerp(0.68, 0.99, progress(t, 8.00, 8.42));
    const tokenCost = lerp(0.84, 0.24, progress(t, 8.42, 8.85)); // slides DOWN to save 60%!
    const neonGlow = lerp(0.32, 1.00, progress(t, 8.85, 9.25));

    // Export progress (10.82..11.52s)
    const exportProgress = progress(t, 10.82, 11.52, easeOutCubic);
    // Ending transition (11.65..12.15s)
    const ending = progress(t, 11.65, 12.15, easeInOutCubic);

    // Active artwork in Center Preview Phone
    let kind = 'code';
    if (ending > 0.3) {
      // Fast exciting montage in ending, landing on hero neon stage!
      if (t < 12.05) kind = 'code';
      else if (t < 12.35) kind = 'reason';
      else if (t < 12.65) kind = 'context';
      else kind = 'neon';
    } else if (t < 2.25) kind = 'code';
    else if (t < 2.75) kind = 'reason';
    else if (t < 3.25) kind = 'context';
    else if (t < 3.70) kind = 'neon';
    else if (t < 5.55) kind = 'reason'; // bloat focus gag happens on reason clip
    else if (t < 6.45) kind = 'context'; // spin + glitch transition showcase
    else if (t < 7.45) kind = 'context'; // caption typing
    else kind = 'neon'; // slider crank + beat drop + export!

    // Typing caption length ("XHigh 强推理!")
    const captionFull = 'XHigh 强推理!';
    const captionLen = t < 6.78 ? 0 : Math.min(captionFull.length, Math.floor(progress(t, 6.78, 7.36, x => x) * (captionFull.length + 0.5)));

    // Playhead position along timeline (0..14s visual track progress)
    let playhead = 0.05;
    if (t >= 1.5 && t < 3.7) playhead = lerp(0.05, 0.52, progress(t, 1.5, 3.7, x => x));
    else if (t >= 3.7 && t < 5.55) playhead = lerp(0.34, 0.42, progress(t, 3.7, 5.55, x => x));
    else if (t >= 5.55 && t < 7.45) playhead = lerp(0.44, 0.72, progress(t, 5.55, 7.45, x => x));
    else if (t >= 7.45 && t < 11.65) playhead = lerp(0.72, 0.96, progress(t, 7.45, 11.65, x => x));
    else if (t >= 11.65) playhead = 0.96;

    // Punch & flash intensities for Neon Stage
    const punch = t >= 9.35 ? 1 : progress(t, 8.85, 9.35);
    const flash = neonGlow;

    return {
      t, frame, cut, tab, thinkVal, codeAcc, tokenCost, neonGlow,
      exportProgress, ending, kind, captionFull, captionLen, playhead, punch, flash
    };
  }

  // Smooth Virtual Camera (pan & zoom following the story!)
  function cameraAt(t) {
    // Keyframes: [time, zoom, cx, cy] where (cx,cy) is focal point in 1080x1080 space
    const keys = [
      [0.00, 1.00, 540, 540],
      [1.35, 1.00, 540, 540],
      [1.75, 1.08, 430, 580],  // Focus left sidebar + timeline dragging
      [3.55, 1.08, 470, 610],
      [3.95, 1.16, 520, 535],  // Zoom into center phone & bloat cut
      [5.35, 1.16, 515, 565],
      [5.75, 1.12, 430, 480],  // Left transitions + phone + caption
      [7.20, 1.12, 470, 460],
      [7.60, 1.22, 765, 425],  // Pan right to 调参 sliders!
      [9.15, 1.22, 755, 445],
      [9.55, 1.09, 560, 600],  // Pull back for Beat Drop dance!
      [10.60, 1.09, 595, 575],
      [10.95, 1.04, 640, 420], // Pan slightly up-right for Export click
      [11.55, 1.00, 540, 540], // Settle wide for Grand Finale
      [14.00, 1.00, 540, 540],
    ];
    let k0 = keys[0], k1 = keys[keys.length - 1];
    for (let i = 0; i < keys.length - 1; i++) {
      if (t >= keys[i][0] && t <= keys[i + 1][0]) {
        k0 = keys[i]; k1 = keys[i + 1]; break;
      }
    }
    const u = k1[0] === k0[0] ? 0 : easeInOutCubic((t - k0[0]) / (k1[0] - k0[0]));
    const zoom = lerp(k0[1], k1[1], u);
    const cx = lerp(k0[2], k1[2], u);
    const cy = lerp(k0[3], k1[3], u);
    // SVG transform translate(tx ty) scale(zoom) keeps (cx, cy) centered while clamping viewport inside 0..1080
    const minT = 1080 - 1080 * zoom;
    const tx = clamp(540 - cx * zoom, minT, 0);
    const ty = clamp(540 - cy * zoom, minT, 0);
    return { zoom, tx, ty };
  }

  function renderEditorMascot(s) {
    const t = s.t;
    if (t < 1.35 || s.ending >= 0.99) return '';
    const op = progress(t, 1.35, 1.60) * (1 - s.ending);

    // Mascot position along the desk / timeline rail (never obscures Phone or Right Panel spec card)
    let x = 152, y = 696;
    if (t >= 3.70 && t < 5.55) { x = lerp(152, 270, progress(t, 3.70, 4.10)); y = 702; }
    if (t >= 5.55 && t < 7.40) { x = lerp(270, 175, progress(t, 5.55, 5.85)); y = 698; }
    if (t >= 7.40 && t < 9.35) { x = lerp(175, 628, progress(t, 7.40, 7.72)); y = 678; }
    if (t >= 9.35 && t < 10.72) {
      x = lerp(628, 760, progress(t, 9.35, 10.72, x => x));
      y = 700 - 11 * Math.abs(Math.sin(t * (128 / 60) * Math.PI));
    }
    if (t >= 10.72) { x = lerp(760, 825, progress(t, 10.72, 11.05)); y = 678; }

    const sx = x + 66, sy = y + 30;
    let target = null;
    let heldHtml = '';

    // Dragging 4 capability cards (1.52..3.44s)
    if (t >= 1.52 && t < 3.44) {
      const i = clamp(Math.floor((t - 1.52) / 0.48), 0, 3);
      const p = ((t - 1.52) / 0.48) % 1;
      const u = progress(p, 0.25, 0.88);
      const fromX = 98 + (i % 2) * 124;
      const fromY = 218 + Math.floor(i / 2) * 176;
      const toX = 195 + i * 212;
      const toY = 826;
      target = [lerp(fromX, toX, u), lerp(fromY, toY, u)];
      const kinds = ['code', 'reason', 'context', 'neon'];
      heldHtml = `
        <g transform="rotate(${(Math.sin(t * 9) * 8).toFixed(1)} ${target[0].toFixed(1)} ${target[1].toFixed(1)})">

          ${ArtTile(target[0] - 32, target[1] - 40, 64, 80, kinds[i], 'held-card')}

    }
    // Scissor snip bloat (4.52..5.05s)
    if (t >= 4.52 && t < 5.08) {
      const u = progress(t, 4.52, 4.82);
      target = [lerp(370, 434, u), lerp(760, 838, u)];
    }
    // Dragging transitions (5.68..6.55s)
    if (t >= 5.68 && t < 6.12) {
      const u = progress(t, 5.75, 6.08);
      target = [lerp(98, 495, u), lerp(208, 828, u)];
      heldHtml = `<g><circle cx="${target[0].toFixed(1)}" cy="${target[1].toFixed(1)}" r="20" fill="#fffdf4" stroke="${INK}" stroke-width="1.9"/>${TransitionIcon(0, target[0], target[1], 0.65)}</g>`;
    } else if (t >= 6.18 && t < 6.60) {
      const u = progress(t, 6.22, 6.55);
      target = [lerp(222, 694, u), lerp(208, 828, u)];
      heldHtml = `<g><circle cx="${target[0].toFixed(1)}" cy="${target[1].toFixed(1)}" r="20" fill="#fffdf4" stroke="${INK}" stroke-width="1.9"/>${TransitionIcon(1, target[0], target[1], 0.65)}</g>`;

    // Dragging 4 right sliders (7.55..9.25s)
    if (t >= 7.55 && t < 8.00) target = [808 + 222 * s.thinkVal, 212];

    else if (t >= 8.42 && t < 8.85) target = [808 + 222 * s.tokenCost, 380];
    else if (t >= 8.85 && t < 9.25) target = [808 + 222 * s.neonGlow, 464];

    return `
      <g opacity="${op.toFixed(3)}">

        ${t >= 7.55 && t < 9.25 && target ? `<circle cx="${target[0].toFixed(1)}" cy="${target[1].toFixed(1)}" r="15" fill="none" stroke="${GOLD}" stroke-width="4.2" opacity="0.88"/>` : ''}

      <linearGradient id="neon-bot-body" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#5d96f7"/>
        <stop offset="55%" stop-color="#4fc6e8"/>
        <stop offset="100%" stop-color="#7c8ef4"/>
      </linearGradient>
      <linearGradient id="neon-bot-leg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4e83de"/>
        <stop offset="100%" stop-color="#697ce0"/>
      </linearGradient>
      <linearGradient id="gemini-star-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#6ff2ff"/>
        <stop offset="50%" stop-color="#6e98ff"/>
        <stop offset="100%" stop-color="#c693ff"/>
      </linearGradient>
      <linearGradient id="gemini-bar-grad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4ed4e8"/>
        <stop offset="50%" stop-color="#6992f5"/>
        <stop offset="100%" stop-color="#a884f2"/>
      </linearGradient>
      <linearGradient id="art-code-bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#283159"/>
        <stop offset="100%" stop-color="#495387"/>
      </linearGradient>
      <linearGradient id="art-reason-bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#272654"/>
        <stop offset="60%" stop-color="#4d4487"/>
        <stop offset="100%" stop-color="#353c6e"/>
      </linearGradient>
      <linearGradient id="art-ctx-bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c6efe7"/>
        <stop offset="100%" stop-color="#e8f6d7"/>
      </linearGradient>
      <linearGradient id="art-neon-bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2c3169"/>
        <stop offset="58%" stop-color="#6b569e"/>
        <stop offset="100%" stop-color="#3a3369"/>
      </linearGradient>
      <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
        <path d="M0 0 V9 M3.5 0 V9" stroke="#302d27" stroke-width="1" opacity="0.28"/>
      </pattern>
      <pattern id="paper-grain" width="80" height="80" patternUnits="userSpaceOnUse">
        ${Array.from({ length: 28 }, (_, i) =>
          `<circle cx="${(seed(i) * 80).toFixed(1)}" cy="${(seed(i + 80) * 80).toFixed(1)}" r="${(0.35 + seed(i + 160) * 0.75).toFixed(2)}" fill="#8b7c63" opacity="0.16"/>`).join('')}
      </pattern>
      <g id="thumb-code">${ArtCode(1, true)}</g>
      <g id="thumb-reason">${ArtReason(1, true)}</g>
      <g id="thumb-context">${ArtContext(1, true)}</g>
      <g id="thumb-neon">${ArtNeonStage(1, true, 0.4, 0.7)}</g>
    </defs>`;

  const stageEl = document.getElementById('stage');

  function renderFrame(frame) {
    const f = clamp(Math.round(frame), 0, TOTAL_FRAMES - 1);
    const s = stateAt(f);
    const cam = cameraAt(s.t);
    const draw = progress(s.t, 0.16, 1.05, easeInOutCubic);

    // Pencil tracing sidebar border (0.16..1.18s)
    let pencilHtml = '';
    if (s.t < 1.32) {
      const px = s.t < 0.62 ? lerp(42, 292, progress(s.t, 0.16, 0.62, x => x)) : 292;
      const py = s.t < 0.62 ? 92 : lerp(92, 646, progress(s.t, 0.62, 1.05, x => x));
      pencilHtml = `
        <g opacity="${(1 - progress(s.t, 1.08, 1.30)).toFixed(3)}">
          <rect x="28" y="92" width="264" height="556" rx="12" fill="#eee9df" opacity="${(draw * 0.72).toFixed(3)}"/>
          <rect x="28" y="92" width="264" height="556" rx="12" fill="none" stroke="${INK}" stroke-width="2.7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1 - draw).toFixed(3)}"/>
          <g transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(-28) scale(1.35)">
            <path d="M0 0 h24 v8 H0 l-8 -4Z" fill="${GOLD}" stroke="${INK}" stroke-width="1.4"/>
            <path d="M20 0 h6 v8 h-6" fill="#e28ea1" stroke="${INK}" stroke-width="1.3"/>
            <path d="M-8 4 l3 -1.6 v3.2Z" fill="${INK}"/>
          </g>
        </g>`;
    }

    const uiFade = 1 - s.ending * 0.74;
    const panelsIn = progress(s.t, 0.88, 1.35, easeOutCubic);
    const phoneIn = progress(s.t, 1.05, 1.45, easeOutBack);

    stageEl.innerHTML = `
      ${DEFS_HTML}
      <rect width="1080" height="1080" fill="${PAPER}"/>
      <g transform="translate(${cam.tx.toFixed(2)} ${cam.ty.toFixed(2)}) scale(${cam.zoom.toFixed(4)})">
        <g opacity="${uiFade.toFixed(3)}">
          ${Box({ x: 14, y: 14, w: 1052, h: 1052, r: 20, fill: PAPER, sw: 2.5 })}
          <g opacity="${progress(s.t, 0.0, 0.25).toFixed(3)}">${renderToolbar(s)}</g>
          ${pencilHtml}
          <g opacity="${panelsIn.toFixed(3)}">
            ${renderSidebar(s)}
            ${renderSettings(s)}
            ${renderTimeline(s)}
          </g>
          ${s.ending === 0 ? `<g opacity="${clamp(phoneIn).toFixed(3)}" transform="translate(540 352) scale(${lerp(0.92, 1, phoneIn).toFixed(4)}) translate(-540 -352)">${renderPhone(s)}</g>` : ''}
          ${renderEditorMascot(s)}
        </g>
      </g>
      ${s.ending > 0 ? renderEnding(s) : ''}
      <rect width="1080" height="1080" fill="url(#paper-grain)" pointer-events="none" opacity="0.54"/>
    `;
  }

  window.TOTAL_FRAMES = TOTAL_FRAMES;
  window.FPS = FPS;
  window.setFrame = renderFrame;
  window.__ready = false;

  // Interactive browser playback controls (disabled in ?render=1 mode)
  let playing = !RENDER_MODE;
  let curFrame = 0;
  let lastTs = 0;
  const scrubber = document.getElementById('scrubber');
  const timeLabel = document.getElementById('time-label');
  const btnPlay = document.getElementById('btn-play');
  const btnReplay = document.getElementById('btn-replay');

  function syncUI() {
    scrubber.value = Math.round(curFrame);
    timeLabel.textContent = `${(curFrame / FPS).toFixed(2).padStart(5, '0')}s / 14.00s`;
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (playing) {
      curFrame = (curFrame + dt * FPS) % TOTAL_FRAMES;
      renderFrame(curFrame);
      syncUI();
    }
    requestAnimationFrame(loop);
  }

  if (!RENDER_MODE) {
    btnPlay.onclick = () => { playing = !playing; btnPlay.textContent = playing ? '暂停' : '播放'; };
    btnReplay.onclick = () => { curFrame = 0; playing = true; btnPlay.textContent = '暂停'; renderFrame(0); syncUI(); };
    scrubber.oninput = () => { playing = false; btnPlay.textContent = '播放'; curFrame = Number(scrubber.value); renderFrame(curFrame); syncUI(); };
  }

  document.fonts.ready.then(() => {
    renderFrame(0);
    window.__ready = true;
    if (!RENDER_MODE) requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
